name: build

on:
  workflow_call:
    outputs:
      review:
        value: ${{ jobs.review.outputs.review }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      review: ${{ steps.llm-detection.outputs.response }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get all files in branch
        id: all-files
        run: |
          pwd
          mkdir app
          cd app
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          git ls-tree -r --name-only HEAD >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          ls -l ./
          ls -l ../

      - name: LLM Detection
        id: llm-detection
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.LLM }}
        run: |
          ls -l
          pwd
          set -e
          REVIEW=$(python3 llm-detection.py ./app)
          echo "response<<EOF" >> "$GITHUB_OUTPUT"
          echo "$REVIEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> $GITHUB_OUTPUT"

